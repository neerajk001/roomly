name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roomdesigner
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  AUTH_REQUIRE_EMAIL_VERIFICATION: "false"
  DEV_AUTH_BYPASS: "false"
  IMAGE_PROVIDER: fake
  EMAIL_PROVIDER: console
  # MinIO started below for upload/render tests.
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: roomdesigner
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roomdesigner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm --filter @roomdesigner/db exec prisma validate

      - name: Prisma generate
        run: pnpm db:generate

      - name: Migrate database
        run: pnpm --filter @roomdesigner/db exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        # Vitest 5 shares node_modules/.vitest-cache between workspace packages;
        # running the packages serially avoids a cache-cleanup race on agents.
        run: pnpm test -- --concurrency=1

      - name: Start MinIO for upload tests
        run: |
          docker compose up -d minio
          docker compose run --rm minio-init

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Production build
        run: pnpm build

      - name: Stop MinIO
        if: always()
        run: docker compose down -v --remove-orphans

  docker:
    name: Validate ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: worker
            dockerfile: apps/worker/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: roomdesigner-${{ matrix.name }}:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
