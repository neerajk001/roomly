name: Deploy

on:
  # Only production pushes that passed CI. Pull-request CI runs are ignored.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or SHA to deploy (defaults to the selected branch)
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  WEB_IMAGE: roomdesigner-web
  WORKER_IMAGE: roomdesigner-worker
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Deploy production
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Configure required reviewers on this environment for manual approval.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.ref || github.sha }}

      - name: Resolve image metadata
        id: vars
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: ${{ vars.WEB_PLATFORM || 'linux/amd64' }}
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/${{ env.WEB_IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/${{ env.WEB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          platforms: ${{ vars.WORKER_PLATFORM || 'linux/amd64' }}
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/${{ env.WORKER_IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/${{ env.WORKER_IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Apply migrations
        env:
          # Neon's direct (non-pooled) URL.
          DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::NEON_DIRECT_DATABASE_URL is not set"
            exit 1
          fi
          pnpm --filter @roomdesigner/db exec prisma migrate deploy

      - name: Deploy stack on Hostinger VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            APP_DIR="${APP_DIR:-/opt/roomdesigner}"
            cd "$APP_DIR"
            test -f docker-compose.prod.yml || { echo "docker-compose.prod.yml missing in $APP_DIR"; exit 1; }
            test -f .env.production || { echo ".env.production missing in $APP_DIR"; exit 1; }

            export GHCR_OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
            export IMAGE_TAG="${{ steps.vars.outputs.sha }}"

            echo "${{ secrets.VPS_GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose --env-file .env.production -f docker-compose.prod.yml pull web worker
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180 web worker
            docker image prune -f --filter "until=168h"

      - name: Smoke test production health
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if [ -z "${PRODUCTION_URL}" ]; then
            echo "::warning::PRODUCTION_URL is not set; skipping the public smoke test"
            exit 0
          fi
          for attempt in $(seq 1 30); do
            status="$(curl -fsS -o /dev/null -w '%{http_code}' "${PRODUCTION_URL%/}/api/health" || true)"
            if [ "${status}" = "200" ]; then
              echo "Production health check passed (attempt ${attempt})"
              exit 0
            fi
            echo "Attempt ${attempt}: /api/health returned ${status:-no response}"
            sleep 10
          done
          echo "::error::Production health check failed after 5 minutes"
          exit 1
