# Production backend for the Hostinger VPS.
# The web app (Next.js UI + API/server actions) is deployed separately on
# Vercel; this file runs the pg-boss worker (and one-off migrations).
#
# Usage on the VPS:
#   cp deploy/.env.production.example .env.production  # fill in real values
#   IMAGE_TAG=<git-sha> docker compose -f docker-compose.prod.yml pull
#   IMAGE_TAG=<git-sha> docker compose -f docker-compose.prod.yml up -d --wait
#
# Migrations are normally run by CI before the new worker starts. For a
# manual release use:
#   docker compose -f docker-compose.prod.yml --profile tools run --rm migrate
name: roomdesigner

services:
  worker:
    image: ghcr.io/${GHCR_OWNER:-YOUR_GH_ORG}/roomdesigner-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      WORKER_HEALTH_PORT: "3002"
      NODE_OPTIONS: "--max-old-space-size=768"
    expose:
      - "3002"
    # The image is immutable: the app never needs to write inside it. Temp
    # files go to an in-memory volume, and dropping all capabilities limits
    # the blast radius if the process is compromised.
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    mem_limit: ${WORKER_MEMORY_LIMIT:-1g}
    cpus: ${WORKER_CPUS:-1.0}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- "http://127.0.0.1:$${WORKER_HEALTH_PORT}/health" >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # One-off migration runner. Use `--profile tools run --rm migrate` before a
  # deploy if you are not running migrations from CI.
  migrate:
    image: ghcr.io/${GHCR_OWNER:-YOUR_GH_ORG}/roomdesigner-worker:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    restart: "no"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    security_opt:
      - no-new-privileges:true
    command:
      - pnpm
      - --filter
      - "@roomdesigner/db"
      - exec
      - prisma
      - migrate
      - deploy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
