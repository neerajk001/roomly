services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roomdesigner
    ports:
      # 5432 is claimed by a native PostgreSQL install on some dev machines
      # (Windows allows both to bind); 5433 is used by another local project.
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO community images were removed from Docker Hub/quay.io in 2026;
    # Chainguard publishes a maintained build of the same binary.
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: amazon/aws-cli:latest
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do
        aws s3api head-bucket --bucket roomdesigner 2>/dev/null && exit 0;
        aws s3api create-bucket --bucket roomdesigner 2>/dev/null && exit 0;
        echo waiting for minio; sleep 2;
      done;
      echo failed to create bucket; exit 1
      "

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP
    environment:
      MP_MAX_MESSAGES: 5000

volumes:
  postgres-data:
  minio-data:
